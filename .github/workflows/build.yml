name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Unit and integration tests
        run: swift test
      - name: Synthetic MP4 encoding and full decode
        run: swift run PumpkinMediaQA /tmp/pumpkin-media-qa
      - name: Build universal macOS app
        run: scripts/build.sh
      - name: Package app
        run: scripts/package-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Pumpkin-macOS
          path: |
            release/Pumpkin-*.zip
            release/SHA256SUMS
